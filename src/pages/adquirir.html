<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../assets/icons/juan1logo.jfif">
  <link rel="stylesheet" href="../css/style.css">
  <title>Juan1: adquirir livro.</title>
</head>
<body class="form-page">
  <header class="site-header">
    <a class="site-name" href="../../index.html">Juan1.</a>
    <p>Visite e conheça nosso catálogo de livros.</p>
  </header>
  <main class="form-card">
    <h1>Faça o download do  livro:</h1>
    <p id="book-title"></p>
    <p>Opcionalmente, preencha seus dados para receber notificações sobre novos lançamentos.</p>

    <form id="download-form">
      <label for="name">Nome:</label>
      <input id="name" name="name" type="text" autocomplete="name">

      <label for="email">E-mail:</label>
      <input id="email" name="email" type="email" autocomplete="email">

      <button class="form-button" id="download-button" type="submit">Fazer download</button>
    </form>

    <p id="status" role="status" aria-live="polite">Ative o JavaScript para liberar o download.</p>
    <a id="download-link" hidden>Se o download não começar, clique aqui.</a>
    <a class="back-link" href="../../index.html">Voltar para os livros</a>
  </main>
  <footer class="site-footer" aria-hidden="true"></footer>
  <script src="../js/main.js"></script>
</body>
</html>
